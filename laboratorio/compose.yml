name: cbi-modbus-lab

services:
  plc:
    build: .
    container_name: cbi-plc
    working_dir: /app
    command: python plc_server.py
    volumes:
      - ./:/app
    networks:
      ics_net:
        ipv4_address: 172.28.0.10
    # Solo para el laboratorio: permite ejecutar tcpdump dentro del PLC y
    # capturar todo el tráfico que llega o sale de él (HMI y atacante).
    cap_add:
      - NET_RAW
    # Descomenta solo si necesitas conectar desde el host (por ejemplo, con mbtget).
    # En una planta real el PLC no debe exponerse fuera de su zona.
    # ports:
    #   - "1502:502"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',502),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  hmi:
    build: .
    container_name: cbi-hmi
    working_dir: /app
    command: python hmi_client.py --host plc
    volumes:
      - ./:/app
    depends_on:
      plc:
        condition: service_healthy
    networks:
      ics_net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # Comparte el namespace de red del HMI: ve todo el tráfico Modbus/TCP del HMI
  # (peticiones y respuestas). Equivale a un puerto espejo/SPAN o a un HMI comprometido.
  capture:
    build: .
    container_name: cbi-capture
    working_dir: /app
    command: sleep infinity
    volumes:
      - ./:/app
      - ./captures:/captures
    depends_on:
      - hmi
    network_mode: "service:hmi"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

  attacker:
    build: .
    container_name: cbi-attacker
    working_dir: /app
    command: sleep infinity
    volumes:
      - ./:/app
    depends_on:
      plc:
        condition: service_healthy
    networks:
      ics_net:
        ipv4_address: 172.28.0.66
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Necesario para hacer de intermediario (ARP spoofing + forwarding).
    # Algunos Docker Desktop no permiten este sysctl; si falla, coméntalo.
    # sysctls:
    #   - net.ipv4.ip_forward=1
    restart: unless-stopped

networks:
  ics_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
