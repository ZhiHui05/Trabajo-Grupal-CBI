name: cbi-modbus-hmi

services:
  hmi:
    build:
      context: ..
      dockerfile: hmi/Dockerfile
    container_name: cbi-hmi
    working_dir: /app
    command: python -m hmi.hmi_client --host plc
    volumes:
      - ./:/app/hmi:ro
      - ../modbus_map.py:/app/modbus_map.py:ro
    networks:
      ics_net:
        ipv4_address: ${HMI_IP:-172.28.0.11}
    restart: unless-stopped

networks:
  ics_net:
    external: true
    name: cbi-modbus-ics
